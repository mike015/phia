name: CI

on:
  push:
  pull_request:

jobs:
  build-and-a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build static site
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Required accessibility gate: axe-core runs over every page and this
      # step fails the build on any WCAG 2.1 AA violation (PROJECT-BRIEF §8).
      - name: Accessibility tests (WCAG 2.1 AA)
        run: npm run test:a11y
