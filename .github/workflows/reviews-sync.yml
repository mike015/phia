# Reviews sync — GEPLANDE DATA-SYNC, GEEN CI-BUILDCHECK.
#
# Deze workflow haalt dagelijks de actuele Google- en Facebook-beoordelingen op
# en commit de bijgewerkte data/reviews-*.json terug naar de repo. Het is
# nadrukkelijk GEEN build-/testcheck op pushes of PR's.
#
# De vier secrets moeten later in GitHub worden toegevoegd
# (Settings → Secrets and variables → Actions):
#   GOOGLE_PLACES_API_KEY, GOOGLE_PLACE_ID, FACEBOOK_PAGE_ID, FACEBOOK_PAGE_TOKEN
# Zolang ze ontbreken slaat het script elke bron netjes over (no-op) en blijft
# de run groen — er wordt dan simpelweg niets gecommit.
name: Reviews sync

on:
  schedule:
    # Dagelijks om 04:00 UTC.
    - cron: '0 4 * * *'
  workflow_dispatch:

# Nodig om de bijgewerkte JSON terug te kunnen pushen.
permissions:
  contents: write

# Voorkom overlappende runs.
concurrency:
  group: reviews-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch reviews
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
        run: node scripts/fetch-reviews.mjs

      - name: Commit updated review data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reviews-google.json data/reviews-facebook.json
          if git diff --cached --quiet; then
            echo "Geen wijzigingen — niets te committen."
          else
            git commit -m "chore(reviews): dagelijkse sync van beoordelingen"
            git push
          fi
