  # ============================================================
  # NIEUWS — nieuwsberichten (mapcollectie)
  # ============================================================
  - name: nieuws
    label: Nieuws
    folder: content/news
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    summary: '{{title_nl}} ({{date}})'
    description: >-
      Nieuwsberichten. Elk bericht heeft een NL- en EN-versie. Berichten worden
      nog niet automatisch in het menu getoond.
    fields:
      - {
          name: title_nl,
          label: Titel (NL),
          widget: string,
