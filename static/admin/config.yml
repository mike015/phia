  # ============================================================
  # OPENINGSTIJDEN — reguliere tijden + uitzonderingen
  # ============================================================
  - name: openingstijden
    label: Openingstijden
    delete: false
    files:
      - name: opening-hours
        label: Openingstijden
        file: data/opening-hours.json
        description: >-
          De vaste openingstijden per dag en eventuele tijdelijke uitzonderingen
          (vakanties, feestdagen). Tijden in 24-uursnotatie, bijvoorbeeld "12:00".
        fields:
          - name: kitchenFrom
            label: Keuken open vanaf
            widget: string
            hint: 'Tijd waarop de keuken opengaat, bijvoorbeeld "13:30".'
          - name: regular
            label: Vaste openingstijden
            widget: list
            label_singular: Dag
            summary: '{{fields.day}}'
            hint: >-
              Houd alle 7 dagen aanwezig (ma t/m zo) in de juiste volgorde.
              Vink "Gesloten" aan voor gesloten dagen.
            fields:
              - {
                  name: day,
                  label: Dagcode,
                  widget: string,
                  hint: 'Korte dagcode: ma, di, wo, do, vr, za of zo.'
                }
              - {
                  name: closed,
                  label: Gesloten,
                  widget: boolean,
                  default: false,
                  hint: Aanvinken als de zaak deze dag gesloten is.
                }
              - {
                  name: open,
                  label: Open vanaf,
                  widget: string,
                  required: false,
                  hint: 'Openingstijd, bijvoorbeeld "12:00". Laat leeg bij een gesloten dag.'
                }
              - {
                  name: close,
                  label: Gesloten om,
                  widget: string,
                  required: false,
                  hint: 'Sluitingstijd, bijvoorbeeld "19:00". Laat leeg bij een gesloten dag.'
                }
          - name: exceptions
            label: Uitzonderingen
            widget: list
            required: false
            label_singular: Uitzondering
            summary: '{{fields.label_nl}} ({{fields.date_start}} – {{fields.date_end}})'
            hint: >-
              Tijdelijke afwijkingen zoals vakanties of feestdagen. Tijdens de
              periode overschrijft dit de vaste tijden en verschijnt er een
              melding op de startpagina.
            fields:
              - {
                  name: label_nl,
                  label: Omschrijving (NL),
                  widget: string,
                  hint: 'Korte omschrijving in het Nederlands, bijvoorbeeld "Zomervakantie".'
                }
              - {
                  name: label_en,
                  label: Omschrijving (EN),
                  widget: string,
                  hint: Engelse omschrijving (te reviewen).
                }
              - {
                  name: date_start,
                  label: Startdatum,
                  widget: date,
                  format: 'YYYY-MM-DD',
                  hint: Eerste dag van de uitzondering.
                }
              - {
                  name: date_end,
                  label: Einddatum,
                  widget: date,
                  format: 'YYYY-MM-DD',
                  hint: Laatste dag van de uitzondering.
                }
              - {
                  name: closed,
                  label: Gesloten,
                  widget: boolean,
                  default: true,
                  hint: Aanvinken als de zaak in deze periode gesloten is.
                }
              - {
                  name: open,
                  label: Open vanaf,
                  widget: string,
                  required: false,
                  hint: 'Afwijkende openingstijd. Laat leeg bij gesloten.'
                }
              - {
                  name: close,
                  label: Gesloten om,
                  widget: string,
                  required: false,
                  hint: 'Afwijkende sluitingstijd. Laat leeg bij gesloten.'
                }

  # ============================================================
  # REVIEWS — handmatig beheren + automatische sync
  # ============================================================
  - name: reviews
    label: Reviews
    delete: false
    files:
      - name: reviews-manual
        label: Reviews (handmatig)
        file: data/reviews-manual.json
        description: >-
          Eigen, zelfgekozen reviews. Deze worden NOOIT automatisch overschreven.
          Vink "Uitgelicht" aan om een review vooraan op de startpagina te tonen.
        fields:
          - name: reviews
            label: Reviews
            widget: list
            required: false
            label_singular: Review
            summary: '{{fields.author}} — {{fields.source}}'
            fields:
              - {
                  name: author,
                  label: Naam,
                  widget: string,
                  hint: 'Naam van de gast, bijvoorbeeld "Nils".'
                }
              - {
                  name: source,
                  label: Bron,
                  widget: select,
                  options: [Google, Facebook, Overig],
                  default: Overig,
                  hint: 'Waar komt deze review vandaan?'
                }
              - {
                  name: rating,
                  label: Sterren,
                  widget: number,
                  value_type: int,
                  min: 1,
                  max: 5,
                  default: 5,
                  hint: Aantal sterren (1 t/m 5).
                }
              - { name: text, label: Tekst, widget: text, hint: De review-tekst. }
              - {
                  name: featured,
                  label: Uitgelicht,
                  widget: boolean,
                  default: false,
                  hint: Toon deze review bovenaan op de startpagina.
                }
      - name: reviews-google
        label: Reviews (Google — automatisch)
        file: data/reviews-google.json
        description: >-
          Wordt dagelijks automatisch bijgewerkt vanuit Google. Handmatige
          wijzigingen hier kunnen bij de volgende sync worden overschreven —
          gebruik voor eigen reviews de collectie "Reviews (handmatig)".
        fields:
          - { name: source, label: Bron, widget: hidden, default: google }
          - {
              name: rating,
              label: Gemiddelde score,
              widget: number,
              value_type: float,
              min: 0,
              max: 5,
              hint: 'Bijvoorbeeld 4.8.'
            }
          - { name: count, label: Aantal beoordelingen, widget: number, value_type: int, min: 0 }
          - { name: updated, label: Laatst bijgewerkt, widget: string, required: false }
          - name: reviews
            label: Reviews
            widget: list
            required: false
            label_singular: Review
            summary: '{{fields.author}}'
            fields:
              - { name: author, label: Naam, widget: string }
              - {
                  name: rating,
                  label: Sterren,
                  widget: number,
                  value_type: int,
                  min: 1,
                  max: 5,
                  default: 5
                }
              - { name: text, label: Tekst, widget: text }
              - { name: time, label: Datum/tijd, widget: string, required: false }
      - name: reviews-facebook
        label: Reviews (Facebook — automatisch)
        file: data/reviews-facebook.json
        description: >-
          Wordt dagelijks automatisch bijgewerkt vanuit Facebook. Facebook levert
          alleen de gemiddelde score en het aantal; losse teksten voeg je
          handmatig toe via "Reviews (handmatig)".
        fields:
          - { name: source, label: Bron, widget: hidden, default: facebook }
          - {
              name: rating,
              label: Gemiddelde score,
              widget: number,
              value_type: float,
              min: 0,
              max: 5
            }
          - { name: count, label: Aantal beoordelingen, widget: number, value_type: int, min: 0 }
          - { name: updated, label: Laatst bijgewerkt, widget: string, required: false }
          - name: reviews
            label: Reviews
            widget: list
            required: false
            label_singular: Review
            summary: '{{fields.author}}'
            fields:
              - { name: author, label: Naam, widget: string }
              - {
                  name: rating,
                  label: Sterren,
                  widget: number,
                  value_type: int,
                  min: 1,
                  max: 5,
                  default: 5
                }
              - { name: text, label: Tekst, widget: text }
              - { name: time, label: Datum/tijd, widget: string, required: false }

  # ============================================================
  # MENU — de volledige menukaart
  # ============================================================
  - name: menu
    label: Menukaart
    delete: false
    files:
      - name: menu
        label: Menukaart
        file: data/menu.json
        description: >-
          De volledige menukaart met categorieën, gerechten en prijzen, plus de
          PDF-versie. NL en EN staan naast elkaar; vul beide in.
        fields:
          - {
              name: edition_nl,
              label: Editie (NL),
              widget: string,
              hint: 'Bijvoorbeeld "Menukaart — editie juli 2026".'
            }
          - {
              name: edition_en,
              label: Editie (EN),
              widget: string,
              hint: 'Engelse editie-aanduiding, bijvoorbeeld "Menu — July 2026 edition".'
            }
          - name: pdf
            label: Menukaart (PDF)
            widget: file
            required: false
            hint: Upload of kies de PDF van de volledige menukaart.
          - name: categories
            label: Categorieën
            widget: list
            label_singular: Categorie
            summary: '{{fields.nl}}'
            hint: De categorieën op de kaart, in de volgorde waarin ze getoond worden.
            fields:
              - {
                  name: id,
                  label: ID (technisch),
                  widget: string,
                  hint: 'Korte unieke code zonder spaties, bijvoorbeeld "gerechten".'
                }
