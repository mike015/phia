                label: Badge
                widget: select
                required: false
                default: ''
                hint: Optioneel label voor de hele categorie.
                options:
                  - { label: Halal, value: halal }
                  - { label: Niet halal, value: niet-halal }
                  - { label: Vegetarisch, value: vega }
