              - { name: label, label: Taalnaam, widget: string, hint: 'Bijvoorbeeld "Nederlands".' }
          - name: nav
            label: Navigatie
            widget: object
            hint: Teksten in het menu en de knoppen bovenaan.
            fields:
              - {
                  name: home,
                  label: 'Menu — Home',
                  widget: string,
                  hint: Naam van de startpagina in het menu.
