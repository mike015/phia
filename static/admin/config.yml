# Sveltia CMS-configuratie voor Phia's Smulparadijs.
# Alle labels en hints zijn in het Nederlands; de eigenaren bewerken alles via formulieren.
# Elke opslag = een commit naar GitHub → Cloudflare bouwt de site opnieuw.

backend:
  name: github
  repo: mike015/phia
  # LET OP: zet dit bij livegang op de productie-branch (bv. "main").
  branch: claude/new-project-seo-responsive-38rc1b
  # Productie-login via de OAuth-Worker (workers/cms-auth). Deploy die Worker,
  # vul hieronder de Worker-URL in en haal de "#" weg (zie CMS.md):
  # base_url: https://phia-cms-auth.JOUW-SUBDOMEIN.workers.dev
  # auth_endpoint: auth

# Lokaal testen zonder GitHub-OAuth (zie CMS.md → "Lokaal testen").
local_backend: true

# Media: geüploade bestanden komen in static/uploads en zijn op de site bereikbaar via /uploads.
media_folder: static/uploads
public_folder: /uploads

collections:
  # ============================================================
  # TALEN — het talenregister (klaar voor meer dan 2 talen)
  # ============================================================
  - name: talen
    label: Talen
    delete: false
    files:
      - name: locales
        label: Talenregister
        file: data/locales.json
        description: >-
          De talen waarin de website beschikbaar is. De standaardtaal wordt op
          "/" getoond, elke andere taal onder "/<code>". Een taal toevoegen =
          hier een regel toevoegen én de bijbehorende teksten invullen.
        fields:
          - name: default
            label: Standaardtaal (code)
            widget: string
            hint: >-
              De taalcode die op de hoofd-URL "/" wordt getoond, bijvoorbeeld "nl".
              Moet overeenkomen met een code hieronder.
          - name: locales
            label: Beschikbare talen
            widget: list
            label_singular: Taal
            summary: '{{fields.label}} ({{fields.code}})'
            hint: De lijst met talen. Sleep om de volgorde in de taalkiezer te wijzigen.
            fields:
              - name: code
                label: Taalcode
                widget: string
                hint: Korte code, bijvoorbeeld "nl" of "en". Wordt in de URL gebruikt.
              - name: label
                label: Weergavenaam
                widget: string
                hint: Naam van de taal zoals getoond in de taalkiezer, bijvoorbeeld "Nederlands".
              - name: og
                label: OpenGraph-locale
                widget: string
                hint: Voor social media, bijvoorbeeld "nl_NL" of "en_GB".
              - name: html
                label: HTML lang-code
                widget: string
                hint: Waarde voor het lang-attribuut van de pagina, bijvoorbeeld "nl".

