                  name: nl,
                  label: Naam (NL),
                  widget: string,
                  hint: Naam van de categorie in het Nederlands.
                }
              - {
                  name: en,
                  label: Naam (EN),
                  widget: string,
                  hint: Naam van de categorie in het Engels.
                }
